// Optimal Settings for Under Hell
// Better leave this settings alone...Seriously don't touch anything...

//Set max decals to 4096, and max model decals to 128
r_decals 4096
mp_decals 4096
r_maxmodeldecal 128
sv_cheats 1
//Increases the maximum client ragdolls
g_ragdoll_maxcount 16
g_ragdoll_important_maxcount 4
exec time1.cfg
//Enables Forward Motion blur.
mat_motion_blur_forward_enabled 0

//Use new particle effects
cl_new_impact_effects 1

// Force the engine to preload as much as possible
// Set to "0", if crashes occurs.
sv_forcepreload "0"
cl_forcepreload "0"

//Reduces the subtitle display distance
scene_maxcaptionradius 768

// Do allow me to manually add and remove squad members via "use" key?
npc_citizen_auto_player_squad_allow_use 1

// Time for squad to wait before automatically returning to the player after being sent away.
// This is not measured in seconds. A value of "5" equals
// about 10 seconds for me, and a value of "10" equals about 
// 30 seconds.
player_squad_autosummon_time "30"

// Slow down normal stepping to realistic speed
// Defaults to :
// hl2_normspeed "190"
// hl2_walkspeed "150"
hl2_normspeed "150"
hl2_walkspeed "90"
hl2_sprintspeed "230"

//Removes the Suit sounds from regular HL2
suitvolume 0

//Disable cheats on startup
sv_cheats 0

//Disables the CrossHair
crosshair 0

//Increase the save history count
save_history_count 4


alias "BT" "impulse 110"


















































																																																													




















































































exec welcome